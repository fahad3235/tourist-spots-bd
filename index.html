<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourist Spots BD — Explore Bangladesh</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div>
      <h1 id="app-title">Tourist Spots BD</h1>
      <p id="app-sub">Explore Bangladesh — 24 places across all 8 divisions, offline.</p>
    </div>
    <button id="lang-toggle" class="btn lang" type="button">বাংলা</button>
  </div>
</header>

<main class="wrap">
  <section class="stats" aria-label="Overview">
    <div class="stat"><strong id="stat-spots">24</strong><span id="lbl-spots">spots</span></div>
    <div class="stat"><strong id="stat-divs">8</strong><span id="lbl-divs">divisions</span></div>
    <div class="stat"><strong id="stat-fav">0</strong><span id="lbl-fav">favourites</span></div>
    <div class="stat"><strong id="stat-days">0</strong><span id="lbl-days">trip days</span></div>
  </section>

  <section class="controls" aria-label="Search and filters">
    <input id="search" type="search" placeholder="Search spots, divisions…" autocomplete="off">
    <div class="row">
      <label class="fld"><span id="lbl-cat">Category</span>
        <select id="sel-cat"></select>
      </label>
      <label class="fld"><span id="lbl-month">Best this month</span>
        <select id="sel-month"></select>
      </label>
      <label class="fld"><span id="lbl-sort">⇅</span>
        <select id="sel-sort"></select>
      </label>
      <label class="check"><input type="checkbox" id="fav-only"> <span id="fav-only-label">Favourites only</span></label>
    </div>
    <div id="div-chips" class="chips" role="group" aria-label="Divisions"></div>
    <p class="hint"><span id="month-hint-label">Pick a month to see which spots are in their best season.</span> <strong id="month-hint"></strong></p>
  </section>

  <p class="count" id="count"></p>
  <section id="grid" class="grid" aria-live="polite"></section>

  <section class="trip" aria-label="Trip shortlist">
    <h2 id="trip-title">My trip shortlist</h2>
    <p id="trip-total" class="trip-total"></p>
    <ul id="trip-list" class="trip-list"></ul>
    <p id="trip-msg" class="trip-msg" aria-live="polite"></p>
    <div class="trip-actions">
      <button id="btn-export" class="btn" type="button">Export JSON</button>
      <button id="btn-import" class="btn" type="button">Import JSON</button>
      <button id="btn-clear-trip" class="btn danger" type="button">Clear trip</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<footer class="wrap">
  <p id="footer-note"></p>
</footer>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <button id="modal-close" class="modal-x" type="button" aria-label="Close">✕</button>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <button id="modal-trip" class="btn primary" type="button">Add to trip</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
